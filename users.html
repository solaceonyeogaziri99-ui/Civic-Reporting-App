<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Users | Civic Reporting</title>
  <meta name="description" content="View and manage registered citizen accounts." />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>

  <div class="dashboard-layout">

    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar" id="sidebar">
      <a href="index-1.html" class="sidebar-logo">
        <span class="logo-icon" aria-hidden="true">C</span>
        Civic Reporting
      </a>

      <nav class="sidebar-nav" aria-label="Admin navigation">
        <a href="dashboard-1.html">
          <span class="nav-icon" aria-hidden="true">🏠</span> Dashboard
        </a>
        <a href="reports.html">
          <span class="nav-icon" aria-hidden="true">📄</span> Reports
        </a>
        <a href="users.html" class="active">
          <span class="nav-icon" aria-hidden="true">👥</span> Users
        </a>
        <a href="categories.html">
          <span class="nav-icon" aria-hidden="true">🗂️</span> Categories
        </a>
      </nav>

      <div class="sidebar-footer">
        <a href="login-1.html" class="logout-link">
          <span class="nav-icon" aria-hidden="true">↩</span> Logout
        </a>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ============ MAIN CONTENT ============ -->
    <div class="dashboard-main">

      <!-- ============ HEADER ============ -->
      <header class="dashboard-header">
        <div class="header-left">
          <button class="menu-toggle" aria-label="Toggle sidebar menu" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
          </button>
          <div>
            <h1>Manage Users <span class="role-badge">Admin</span></h1>
            <p class="subtitle">View and manage registered citizen accounts.</p>
          </div>
        </div>

        <div class="header-right">
          <button class="notification-btn" aria-label="View notifications">
            🔔
            <span class="notification-dot" aria-hidden="true"></span>
          </button>
          <div class="header-avatar admin-avatar" aria-hidden="true">A</div>
        </div>
      </header>

      <div class="dashboard-content">

        <section class="dashboard-card">
          <div class="dashboard-card-header">
            <h2>All Users</h2>
          </div>

          <!-- ============ SEARCH ============ -->
          <div class="reports-toolbar">
            <div class="search-field">
              <span class="search-icon" aria-hidden="true">🔍</span>
              <input
                type="text"
                id="userSearchInput"
                placeholder="Search by name, email, or ID..."
                aria-label="Search users by name, email, or ID"
              />
            </div>
          </div>

          <!-- ============ USERS TABLE ============ -->
          <div class="table-scroll">
            <table class="data-table">
              <thead>
                <tr>
                  <th scope="col">ID</th>
                  <th scope="col">Name</th>
                  <th scope="col">Email</th>
                  <th scope="col">Phone</th>
                  <th scope="col">Date Registered</th>
                  <th scope="col">Status</th>
                  <th scope="col">Actions</th>
                </tr>
              </thead>
              <tbody id="usersTableBody">
                <!-- Populated by js/admin.js with demo data + LocalStorage status overrides -->
              </tbody>
            </table>
          </div>
        </section>

      </div>
    </div>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
